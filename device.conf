# devices/unicorn/device.conf: what this device repository is (docs/porting/repositories.md has every word).
#
# The layout is cotunjr/hakios-mayfly's (the Xiaomi 12S port), because that is the port this one is
# derived from. Nothing here is copied from the phone's behaviour: every status line says what has
# been seen on THIS phone, and today nothing has been run on it yet. The facts quoted come from the
# phone's own device tree (see docs/FINDINGS.md for where each one was read).

device unicorn
	title       Xiaomi 12S Pro
	vendor      Xiaomi
	soc         sm8450
	defconfig   unicorn_defconfig
	firmware    docs/FIRMWARE.md
	maintainer  zhouzhoublm
	status      display     partial   WQHD+ 1440x3200 DSC command-mode panel ("l2s", 1-120 Hz) on the framebuffer ABL leaves live; unicornPkg is built for 1440x3200, not yet started on the phone
	status      touch       partial   ST FingerTip (FTS) on SPI SE4, irq gpio21, reset gpio20, 16-bit super-resolution coordinates; the driver is mayfly's, its coordinate ranges must be changed to unicorn's 14400x32000 first
	status      buttons     missing   power and volume through the PMIC arbiter v7 (the SoC's); not started on this phone
	status      cpu         missing   SM8475, 8 cores (0-3 A510, 4-6 A710, 7 X2), EPSS perf states; the loader writes them, nothing verified here yet
	status      gpu         missing   Adreno 730 (part of SM8475); the driver is mayfly's, not started on this phone
	status      storage     partial   UFS at 0x1d84000 (cape PHY v4): the loader takes the controller over from ABL and serves userdata; not verified on this phone
	status      audio       missing   two Cirrus CS35L41 amplifiers on I2C SE15 (0x40 right, 0x43 top, speaker switch gpio52) through the ADSP - NOT mayfly's Awinic AW88261, a driver of its own is needed
	status      battery     missing   through the ADSP's battery manager; not started
	status      haptic      missing   Awinic AW8697 on I2C SE18 (0x5a, reset gpio89, irq gpio90), not the PMIC's hv-haptics; not started
	status      camera      missing   not started
	status      torch       missing   not started
	status      wifi        missing   QCA6490 on PCIe (cnss-qca6490@b0000000), the cape platform's; not started on this phone
	status      bluetooth   missing   QCA6490 on UART QUP SE20, BT_EN gpio81; not started on this phone
	status      cellular    missing   not started
	status      thermal     missing   TSENS and the PMIC ADC channels are in the phone's own tree; not started
	status      usb         partial   the loader's own DWC3 peripheral (fastboot oem run/log); eUSB2 with an NXP repeater on I2C SE5; nothing in iOS
	status      sensors     missing   not started
