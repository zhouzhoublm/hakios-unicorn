# devices/unicorn/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device unicorn
	title       Xiaomi 12S Pro
	vendor      Xiaomi
	soc         sm8450
	defconfig   unicorn_defconfig
	firmware    docs/FIRMWARE.md
	maintainer  cotunjr
	status      display     works     1080x2400 DSC command-mode panel at 120 Hz through the framebuffer ABL leaves live; double buffered (fb_flip=1), DCS brightness
	status      touch       works     ST FTS on bit-banged SPI (GENI SE4 has its FIFO disabled by TZ), 16-bit coordinates, multitouch (touchscreen=1)
	status      buttons     works     power and volume through the PMIC arbiter v7 (touchscreen=1)
	status      cpu         works     7 cores in use (cpus=7 bootcpu=7), EPSS perf states set by the loader, cpu_mhz= ceiling and a 90 C governor
	status      gpu         works     Adreno 730 (hakios.adreno7.c, adreno7=18): GMU, zap shader, CP; OpenGL ES through Mesa freedreno at 580 MHz
	status      storage     works     UFS read/write through the loader's own driver (no UFSDxe); Darwin root on the userdata partition
	status      audio       works     both AW88261 speakers through the ADSP: AudioReach graph with a tertiary TDM sink (adsp=1 sound=4); no microphone
	status      battery     partial   level through ADSP battmgr; Battery Health page spins; charging control not done
	status      haptic      missing   PM8350B hv-haptics, not started
	status      camera      missing   not started
	status      torch       missing   not started
	status      wifi        works     QCA6490 over PCIe with ath11k (LX_CHIP=qca6490): scan, join, internet (wifi_pcie=12 wifi_lx=2 wifi_station=1); start fails now and then
	status      bluetooth   works     QCA6490 over polled UART SE20 at 3 Mbaud, stock bluetoothd, A2DP audio to a speaker (qcabt=6, userland BT=1)
	status      cellular    missing   not started
	status      thermal     partial   TSENS read, CPU governor at 90 C; resets under heavy load near 86-94 C not explained
	status      usb         partial   the loader's own DWC3 peripheral (fastboot oem run/log); no USB in iOS
	status      sensors     missing   not started
