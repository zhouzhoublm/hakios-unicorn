# socs/sm8450/soc.conf: what this SoC repository is: the facts of a Qualcomm SM8450-family chip, whatever phone it is in.
# A phone with this SoC includes configs/sm8450.config from its defconfig. docs/porting/repositories.md has every word.

soc sm8450
	title       Qualcomm SM8450 family (SM8450 "Snapdragon 8 Gen 1", SM8475 "Snapdragon 8+ Gen 1"; "waipio", "cape")
	vendor      Qualcomm
	cores       8, the biggest is core 7
	gpu         Adreno 730
	maintainer  cotunjr
